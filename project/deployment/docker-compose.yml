services:
  backend:
    build:
      context: ../..
      dockerfile: project/deployment/Dockerfile
    environment:
      POC_DB_PATH: /data/poc.sqlite
    ports:
      - "8000:8000"
    volumes:
      - poc-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  poc-data:
